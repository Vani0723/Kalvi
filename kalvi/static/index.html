<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalvi</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Zm-6.5 9.8V17c0 1.7 2.9 4 6.5 4s6.5-2.3 6.5-4v-4.2L12 16.4l-6.5-3.6Z"/></svg>
      </span>
      <div>
        <h1>Kalvi</h1>
        <p class="tagline">Offline AI lecture companion</p>
      </div>
    </div>
    <div class="top-controls">
      <label class="lang">
        <span>Language</span>
        <select id="language" aria-label="Lecture language"></select>
      </label>
      <div id="device" class="device-badge" title="Where the AI models run">
        <span class="dot"></span><span id="device-label">Loading…</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button id="new-lecture" class="btn primary wide">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z"/></svg>
        New lecture
      </button>
      <label class="btn ghost wide" for="import-file">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11 16V7.8L8.4 10.4 7 9l5-5 5 5-1.4 1.4L13 7.8V16h-2Zm-6 4v-5h2v3h10v-3h2v5H5Z"/></svg>
        Import recording
      </label>
      <input id="import-file" type="file" accept="audio/*,.wav,.flac,.ogg" hidden>
      <h2 class="side-title">Your lectures</h2>
      <ul id="lecture-list" class="lecture-list"></ul>
      <p class="privacy">Everything stays on this laptop. No audio or text is uploaded.</p>
    </aside>

    <main class="content">
      <!-- Live lecture -->
      <section id="live-view" class="view">
        <div class="live-head">
          <input id="title" class="title-input" placeholder="Lecture title, e.g. Thermodynamics, Unit 3" aria-label="Lecture title">
          <div class="live-meta">
            <span id="timer" class="timer">00:00</span>
            <div class="meter" aria-hidden="true"><div id="meter-fill"></div></div>
            <span id="speaking" class="speaking">Idle</span>
          </div>
        </div>
        <div class="record-row">
          <button id="record" class="record-btn" aria-label="Start recording">
            <span class="record-icon"></span>
          </button>
          <div>
            <p id="record-hint" class="record-hint">Press record when the lecture starts.</p>
            <p class="record-sub">Speech is transcribed on the device as the teacher speaks.</p>
          </div>
        </div>
        <div id="captions" class="captions" aria-live="polite"></div>
        <section id="bench-card" class="bench-card" hidden>
          <h3>NPU benchmark</h3>
          <div id="bench-body"></div>
        </section>
      </section>

      <!-- Saved lecture -->
      <section id="lecture-view" class="view" hidden>
        <div class="lecture-head">
          <div>
            <h2 id="lv-title"></h2>
            <p id="lv-meta" class="muted"></p>
          </div>
          <button id="lv-delete" class="btn ghost danger">Delete</button>
        </div>
        <audio id="player" controls preload="metadata"></audio>
        <div class="search-row">
          <input id="search" type="search" placeholder="Find a word in this lecture" aria-label="Search transcript">
          <span id="search-count" class="muted"></span>
        </div>
        <p id="import-status" class="import-status" hidden></p>
        <ol id="transcript" class="transcript"></ol>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
