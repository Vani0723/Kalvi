[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalvi"
version = "0.1.0"
description = "Offline AI lecture companion for Snapdragon-powered PCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
kalvi = "kalvi.__main__:main"

[tool.setuptools.packages.find]
include = ["kalvi*"]

[tool.setuptools.package-data]
kalvi = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
